name: Build Radhe Kathiyawadi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=$(find . -name pubspec.yaml \
            -not -path './.git/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project: $PROJECT"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Android platform
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Flutter Pub Get
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter build apk --release

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: radhe-kathiyawadi-release-apk
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
