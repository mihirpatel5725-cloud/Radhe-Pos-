name: Build Radhe Kathiyawadi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=$(find . \
            -name pubspec.yaml \
            -not -path './.git/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          echo "Flutter project: $PROJECT"
          echo "path=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Check Flutter
        run: |
          flutter --version
          java -version

      - name: Generate Android project
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android folder missing."
            echo "Generating Android project..."
            flutter create . --platforms=android
          else
            echo "Android folder already exists."
          fi

      - name: Enable AndroidX
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          mkdir -p android

          if [ ! -f android/gradle.properties ]; then
            touch android/gradle.properties
          fi

          grep -q "^android.useAndroidX=true$" android/gradle.properties || \
            echo "android.useAndroidX=true" >> android/gradle.properties

          grep -q "^android.enableJetifier=true$" android/gradle.properties || \
            echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Flutter Pub Get
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter pub get

      - name: Clean Flutter build
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          flutter clean
          rm -rf build
          rm -rf android/.gradle

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.path }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: radhe-kathiyawadi-release-apk
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
